<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Food Inventory</title>

    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🥬
        </div>

        <h1>Food Inventory</h1>

        <p>Masuk ke akun Anda</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <span id="message"></span>

        <p class="bottom-text">
            Belum punya akun?
            <a href="register.html">Daftar</a>
        </p>

    </div>

</div>

<script src="./js/auth.js"></script>

</body>
</html>
